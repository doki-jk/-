name: Build Windows Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Enforce dependency security
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm run test:run

      - name: Generate application icons
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Build Windows installers
        run: npx tauri build --bundles nsis,msi --locked

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: FuelLog-0.3.0-Windows-Installers
          if-no-files-found: error
          retention-days: 90
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
