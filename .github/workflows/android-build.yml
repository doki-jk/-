name: Android Debug Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Enforce JavaScript dependency security
        run: npm audit --audit-level=high

      - name: Set up Rust Android target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not configured on the runner}"
          NDK_VERSION="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$NDK_VERSION" ]; then
            echo "No Android NDK installation was found under $ANDROID_HOME/ndk" >&2
            exit 1
          fi
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using Android NDK $NDK_VERSION"

      - name: Validate Android Tauri capability
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          desktop = json.loads(Path('src-tauri/capabilities/default.json').read_text(encoding='utf-8'))
          mobile = json.loads(Path('src-tauri/capabilities/mobile.json').read_text(encoding='utf-8'))

          if 'android' in desktop.get('platforms', []):
              raise SystemExit('Desktop capability must not apply to Android')
          if mobile.get('platforms') != ['android']:
              raise SystemExit('Mobile capability must be scoped only to Android')

          required = {'core:default', 'sql:allow-load', 'sql:allow-select', 'sql:allow-execute'}
          missing = required.difference(mobile.get('permissions', []))
          if missing:
              raise SystemExit(f'Android capability is missing required permissions: {sorted(missing)}')
          print('Android capability is scoped and contains the required SQLite permissions')
          PY

      - name: Initialize Android target
        run: npm run tauri:android:init -- --ci --skip-targets-install

      - name: Build aarch64 debug APK
        run: npm run tauri:android:build -- --debug --apk --target aarch64 --ci

      - name: Verify lockfiles unchanged
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuellog-android-aarch64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
