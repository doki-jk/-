name: Build

on:
  push:
    branches: [main, hardening-0.3.0]
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Capture dependency audit
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Run regression tests
        run: npm run test:run

      - name: Build web application
        run: npm run build

      - name: Upload npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  desktop-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate desktop SQL write permission
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          capability = json.loads(Path('src-tauri/capabilities/default.json').read_text(encoding='utf-8'))
          permissions = capability.get('permissions', [])
          if 'sql:allow-execute' not in permissions:
              raise SystemExit('Missing sql:allow-execute: desktop data writes would fail')
          print('Desktop SQL write permission is enabled')
          PY

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        run: |
          rustup default stable
          rustup update stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Upload Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7
