name: Build

on:
  push:
    branches: [main, hardening-0.3.0]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency audit
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce dependency security
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm run test:run

      - name: Build web application
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

  desktop-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate desktop SQL write permission
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          capability = json.loads(Path('src-tauri/capabilities/default.json').read_text(encoding='utf-8'))
          permissions = capability.get('permissions', [])
          if 'sql:allow-execute' not in permissions:
              raise SystemExit('Missing sql:allow-execute: desktop data writes would fail')
          print('Desktop SQL write permission is enabled')
          PY

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked

      - name: Enforce Rust dependency security
        working-directory: src-tauri
        run: cargo audit

      - name: Check Tauri backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify Cargo lockfile unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock
