name: Build

on:
  push:
    branches: [main, hardening-0.3.0]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency audit
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce dependency security
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm run test:run

      - name: Build web application
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package-lock.json

  desktop-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate desktop SQL write permission
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          capability = json.loads(Path('src-tauri/capabilities/default.json').read_text(encoding='utf-8'))
          permissions = capability.get('permissions', [])
          if 'sql:allow-execute' not in permissions:
              raise SystemExit('Missing sql:allow-execute: desktop data writes would fail')
          print('Desktop SQL write permission is enabled')
          PY

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Tauri backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify Cargo lockfile unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock
