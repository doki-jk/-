name: Update Dependency Lockfiles

on:
  push:
    branches: [hardening-0.3.0]
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - .github/workflows/lockfiles.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lockfiles
  cancel-in-progress: true

jobs:
  update-lockfiles:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: hardening-0.3.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfiles when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock && git ls-files --error-unmatch package-lock.json src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo "Lockfiles are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "chore: lock dependencies [skip ci]"
          git push origin HEAD:hardening-0.3.0
