name: Release FuelLog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.3.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm run test:run

      - name: Generate application icons
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Build locked Windows installers
        run: npx tauri build --bundles nsis,msi -- --locked

      - name: Sign installers when certificate secrets are configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "No Windows signing certificate configured. Installers remain unsigned."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "fuellog-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $installers = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($installers.Count -eq 0) { throw "No installers found to sign" }
          foreach ($installer in $installers) {
            & signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.FullName)" }
            & signtool verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($installer.FullName)" }
          }
          Remove-Item $certificatePath -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $lines | Set-Content -Encoding utf8 "SHA256SUMS.txt"
          Get-Content "SHA256SUMS.txt"

      - name: Create release and upload installers
        shell: pwsh
        run: |
          $existing = gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "FuelLog $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Unable to create GitHub Release" }
          }
          $assets = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          $assets += Get-Item "SHA256SUMS.txt"
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Unable to upload $($asset.Name)" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: FuelLog-${{ env.RELEASE_TAG }}-Windows
          retention-days: 90
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
