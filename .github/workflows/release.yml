name: Release FuelLog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.3.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify immutable release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use a version format such as v0.3.2"
          }

          git fetch --force --no-tags origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $($env:RELEASE_TAG) does not exist in the remote repository"
          }

          $tagCommit = (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) {
            throw "Checked-out commit does not match release tag $($env:RELEASE_TAG)"
          }

      - name: Verify release tag matches application version
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $($env:RELEASE_TAG) does not match application version $($config.version); expected $expectedTag"
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Run regression tests
        run: npm run test:run

      - name: Generate application icons
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Build locked Windows installers
        run: npx tauri build --bundles nsis,msi -- --locked

      - name: Sign and verify Windows installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Windows signing certificate and password are required for a public release"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "fuellog-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $installers = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
            if ($installers.Count -eq 0) { throw "No installers found to sign" }

            foreach ($installer in $installers) {
              & signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.FullName)" }
              & signtool verify /pa /v $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($installer.FullName)" }
            }
          }
          finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $lines | Set-Content -Encoding utf8 "SHA256SUMS.txt"
          Get-Content "SHA256SUMS.txt"

      - name: Create release and upload installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $existing = gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "FuelLog $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Unable to create GitHub Release" }
          }
          $assets = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          $assets += Get-Item "SHA256SUMS.txt"
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Unable to upload $($asset.Name)" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FuelLog-${{ env.RELEASE_TAG }}-Windows
          retention-days: 90
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
