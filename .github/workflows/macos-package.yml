name: Build macOS Package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-package:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce npm dependency security
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm run test:run

      - name: Generate macOS application icons
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Build universal macOS app and DMG
        run: npx tauri build --bundles app,dmg --target universal-apple-darwin -- --locked

      - name: Verify universal application binary
        shell: bash
        run: |
          set -euo pipefail
          app_bundle=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_bundle"
          executable=$(find "$app_bundle/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          test -n "$executable"
          architectures=$(lipo -archs "$executable")
          echo "Architectures: $architectures"
          grep -q 'x86_64' <<<"$architectures"
          grep -q 'arm64' <<<"$architectures"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          shasum -a 256 "$dmg" | tee SHA256SUMS-macOS.txt

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FuelLog-0.3.2-macOS-universal
          retention-days: 30
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            SHA256SUMS-macOS.txt
